<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
    <title>Web Scrcpy</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-color: #333;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 60px;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            border-right: 1px solid #444;
        }

        .sidebar .icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            color: #888;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .sidebar .icon:hover {
            background: #333;
            color: #007BFF;
        }

        .sidebar .icon.active {
            background: #28a745;
            color: white;
        }

        .sidebar .icon.off {
            background: #dc3545;
            color: white;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            background: black;
        }

        #status {
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* 被踢下线提示 */
        .rejected-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            color: white;
        }

        .rejected-overlay.visible {
            display: flex;
        }

        .rejected-overlay h2 {
            color: #dc3545;
        }

        /* 重新连接请求弹窗 */
        .request-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            padding: 20px;
            z-index: 1000;
        }

        .request-popup {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .request-popup h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 18px;
        }

        .request-popup p {
            margin: 0 0 20px 0;
            color: #666;
            line-height: 1.6;
            white-space: pre-line;
        }

        .request-buttons {
            display: flex;
            gap: 10px;
        }

        .allow-btn {
            flex: 1;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .allow-btn:hover {
            background: #218838;
        }

        .deny-btn {
            flex: 1;
            padding: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .deny-btn:hover {
            background: #c82333;
        }

        /* 邮箱输入弹窗 */
        .email-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .email-popup {
            background: white;
            border-radius: 12px;
            padding: 25px;
            width: 350px;
            text-align: center;
        }

        .email-popup h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        .email-popup input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .email-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .email-buttons button {
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .email-buttons button:first-child {
            background: #007BFF;
            color: white;
        }

        .email-buttons button:last-child {
            background: #6c757d;
            color: white;
        }

        /* 结果弹窗 */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .result-popup {
            background: white;
            border-radius: 12px;
            padding: 25px;
            width: 350px;
            text-align: center;
        }

        .result-popup h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        .result-popup p {
            margin: 0 0 20px 0;
            color: #666;
            white-space: pre-line;
        }

        .result-popup button {
            padding: 10px 30px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
    <script src="/static/js/socket.io.js"></script>
    <script src="/static/js/input.js"></script>
    <script src="/static/js/exp-golomb.js"></script>
    <script src="/static/js/h264-sps-parser.js"></script>
    <script src="/static/js/video_parser.js"></script>
</head>

<body>
<!-- 被踢下线提示 -->
<div class="rejected-overlay" id="rejectedOverlay">
    <h2>已断开连接</h2>
    <p id="rejectedMessage">另一台设备已连接</p>
    <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 20px; cursor: pointer;">重新连接</button>
</div>

<!-- 左侧边栏 -->
<div class="sidebar">
    <i id="power-icon" class="fa-solid fa-power-off icon" title="Power" onclick="toggleConnection()"></i>
    <i id="rotate-left-icon" class="fa-solid fa-rotate-left icon" title="Rotate Left"
       onclick="rotateScreen('left')"></i>
    <i id="rotate-right-icon" class="fa-solid fa-rotate-right icon" title="Rotate Right"
       onclick="rotateScreen('right')"></i>
    <i id="back-icon" class="fa-solid fa-arrow-left icon" title="Back"></i>
    <i id="home-icon" class="fa-solid fa-house icon" title="Home"></i>
    <i id="menu-icon" class="fa-solid fa-bars icon" title="Menu"></i>
    <i id="reconnect-icon" class="fa-solid fa-rotate icon" title="Reconnect" onclick="handleReconnectClick()"></i>
    <div style="flex: 1;"></div>
    <i id="clients-icon" class="fa-solid fa-user icon" title="Current Connection"></i>
</div>

<!-- 主内容区 -->
<div class="main-content">
    <p id="status" style="display: none;">connecting to device...</p>
    <div class="video-wrapper">
        <video id="player" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
    </div>
</div>

<!-- 重新连接弹窗 -->
<div class="request-overlay" id="requestOverlay" style="display: none;">
    <div class="request-popup">
        <h3>连接请求</h3>
        <p id="requestInfo"></p>
        <div class="request-buttons">
            <button id="allowBtn" class="allow-btn" onclick="handleRequest('allow')">允许 (<span id="countdown">30</span>s)
            </button>
            <button id="denyBtn" class="deny-btn" onclick="handleRequest('deny')">不允许</button>
        </div>
    </div>
</div>

<!-- 邮箱输入弹窗 -->
<div class="email-overlay" id="emailOverlay" style="display: none;">
    <div class="email-popup">
        <h3>请输入邮箱</h3>
        <p>需要填写邮箱才能继续操作</p>
        <input type="email" id="emailInput" placeholder="xxx@openvision.cc"/>
        <div class="email-buttons">
            <button onclick="submitEmail()">确定</button>
            <button onclick="closeEmailPopup()">取消</button>
        </div>
    </div>
</div>

<!-- 请求结果弹窗 -->
<div class="result-overlay" id="resultOverlay" style="display: none;">
    <div class="result-popup">
        <h3 id="resultTitle">提示</h3>
        <p id="resultMessage"></p>
        <button onclick="closeResultPopup()">确定</button>
    </div>
</div>

<script src="/static/js/jmuxer.min.js"></script>
<script>
    let isConnected = false;
    let isAdminDevice = false;  // 是否是主服务机器
    let countdownTimer = null;
    let requestTimeout = null;
    let requestDenied = false;  // 是否被拒绝过
    let pendingRequest = null;
    let myIP = '';  // 本机IP
    const videoElement = document.getElementById('player');
    const jmuxer = new JMuxer({
        node: 'player',
        mode: 'video',
        flushingTime: 0,
        fps: 60,
        clearBuffer: true,
        onReady: () => {
            document.getElementById('status').textContent = 'MSE done, waiting for data...';
            if (videoElement) {
                videoElement.controls = false;
                videoElement.style.cssText = `
                        -webkit-media-controls: none !important;
                        -webkit-media-controls-enclosure: none !important;
                        -webkit-media-controls-panel: none !important;
                        -webkit-media-controls-play-button: none !important;
                        -webkit-media-controls-timeline: none !important;
                        -webkit-media-controls-current-time-display: none !important;
                        -webkit-media-controls-time-remaining-display: none !important;
                        -webkit-media-controls-mute-button: none !important;
                        -webkit-media-controls-volume-slider: none !important;
                        -webkit-media-controls-fullscreen-button: none !important;
                        -moz-controls: none !important;
                        -ms-media-controls: none !important;
                    `;
            }
        },
        onError: (err) => {
            document.getElementById('status').textContent = 'MSE Error: ' + err.message;
        }
    });

    const socket = io({
        reconnection: false,
        autoConnect: true
    });

    // 旋转屏幕 - 通过scrcpy命令调整设备屏幕方向
    function rotateScreen(direction) {
        // 调用input.rotate发送旋转命令到后端
        if (input && input.rotate) {
            input.rotate(direction);
            console.log('Rotation command sent:', direction);
        } else {
            console.log('Input not initialized, cannot rotate');
        }
    }

    // 电源按钮状态
    function updatePowerButton(connected) {
        const powerIcon = document.getElementById('power-icon');
        if (connected) {
            powerIcon.classList.add('active');
            powerIcon.classList.remove('off');
        } else {
            powerIcon.classList.remove('active');
            powerIcon.classList.add('off');
        }
        isConnected = connected;
    }

    // 禁用/启用所有控制按钮
    function setControlButtonsEnabled(enabled) {
        const buttons = [
            'power-icon', 'rotate-left-icon', 'rotate-right-icon',
            'back-icon', 'home-icon', 'menu-icon', 'reconnect-icon'
        ];
        buttons.forEach(id => {
            const btn = document.getElementById(id);
            if (btn) {
                if (enabled) {
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                } else {
                    btn.style.pointerEvents = 'none';
                    btn.style.opacity = '0.3';
                }
            }
        });
    }

    // 切换连接状态（点击电源按钮）
    function toggleConnection() {
        if (!isConnected) {
            // 提示用户点击刷新按钮
            showResult('提示', '请点击刷新按钮发起连接请求');
        } else {
            // 断开连接
            socket.disconnect();
            updatePowerButton(false);
            setControlButtonsEnabled(false);
        }
    }

    var input = null;

    function initInput(width, height) {
        function input_data_cb(data) {
            socket.emit('control_data', data);
        }

        input = new ScrcpyInput(input_data_cb, videoElement, width, height, false);

        const powerIcon = document.getElementById('power-icon');
        const rotateLeftIcon = document.getElementById('rotate-left-icon');
        const rotateRightIcon = document.getElementById('rotate-right-icon');
        const backUpIcon = document.getElementById('back-icon');
        const homeUpIcon = document.getElementById('home-icon');
        const menuUpIcon = document.getElementById('menu-icon');

        powerIcon.addEventListener('mousedown', function () {
            if (input) input.screen_on_off(0);
        });
        powerIcon.addEventListener('mouseup', function () {
            if (input) input.screen_on_off(1);
        });

        backUpIcon.addEventListener('mousedown', (event) => {
            if (input) input.snedKeyCode(event, 0, 4);
        });
        backUpIcon.addEventListener('mouseup', (event) => {
            if (input) input.snedKeyCode(event, 1, 4);
        });
        homeUpIcon.addEventListener('mousedown', (event) => {
            if (input) input.snedKeyCode(event, 0, 3);
        });
        homeUpIcon.addEventListener('mouseup', (event) => {
            if (input) input.snedKeyCode(event, 1, 3);
        });
        menuUpIcon.addEventListener('mousedown', (event) => {
            if (input) input.snedKeyCode(event, 0, 187);
        });
        menuUpIcon.addEventListener('mouseup', (event) => {
            if (input) input.snedKeyCode(event, 1, 187);
        });
    }

    const parser = new VideoParser(({type, data}) => {
        if (type === 'nalu') {
            jmuxer.feed({
                video: data
            });
        } else if (type === 'init') {
            jmuxer.feed({
                video: data["sps"]
            });
            jmuxer.feed({
                video: data["pps"]
            });
        } else if (type === 'screen_size') {
            initInput(data["width"], data["height"]);
        } else if (type === 'size_change') {
            if (input) {
                input.resizeScreen(data["width"], data["height"]);
            }
        }
    });

    socket.on('video_data', (data) => {
        const newData = new Uint8Array(data);
        parser.appendData(newData);
    });

    socket.on('connect', () => {
        document.getElementById('status').textContent = 'connecting...';
        // 获取本机IP（用于重新连接功能）
        socket.emit('get_my_ip');
    });

    // 获取本机IP
    socket.on('my_ip', (ip) => {
        myIP = ip;
    });

    // 获取设备类型（是否是主服务机器）
    socket.on('device_type', (data) => {
        isAdminDevice = data.is_admin;
        console.log('Device type: admin=' + isAdminDevice);
        // 根据设备类型更新按钮图标和标题
        const reconnectIcon = document.getElementById('reconnect-icon');
        if (isAdminDevice) {
            reconnectIcon.className = 'fa-solid fa-hand-pointer icon';
            reconnectIcon.title = '夺回连接';
        } else {
            reconnectIcon.className = 'fa-solid fa-rotate icon';
            reconnectIcon.title = '刷新连接';
        }
    });

    // 夺回连接结果
    socket.on('admin_reclaim_result', (result) => {
        if (result.success) {
            showResult('已夺回', result.message);
        } else {
            alert(result.message);
        }
    });

    // 连接被接受
    socket.on('connection_accepted', () => {
        console.log('Connection accepted');
        document.getElementById('status').textContent = 'connected, receiving video data...';
        updatePowerButton(true);
        setControlButtonsEnabled(true);
        document.getElementById('rejectedOverlay').classList.remove('visible');
    });

    // 连接被拒绝（被踢下线）
    socket.on('connection_rejected', (data) => {
        console.log('Connection rejected:', data);
        const reason = data.reason;

        if (reason === 'admin_reclaimed') {
            // 管理员重新夺回操作权
            const message = data.message || '管理员已重新夺回操作权，请联系管理员';
            document.getElementById('rejectedMessage').textContent = message;
        } else {
            // 另一台设备连接（不显示IP）
            const englishName = data.english_name || '另一台设备';
            document.getElementById('rejectedMessage').textContent = englishName + '已连接';
        }
        document.getElementById('rejectedOverlay').classList.add('visible');
        updatePowerButton(false);
        setControlButtonsEnabled(false);
    });

    // 需要填写邮箱
    let pendingReconnectAfterEmail = false;
    socket.on('need_email', (data) => {
        console.log('Need email for IP:', data.ip);
        // 弹出邮箱输入框，让用户填写
        pendingReconnectAfterEmail = true;
        document.getElementById('emailOverlay').style.display = 'flex';
    });

    // 邮箱提交结果
    socket.on('email_result', (result) => {
        if (result.success) {
            console.log('Email set successfully');
            // 显示提示，让用户点击刷新按钮
            showResult('邮箱已设置', result.message || '请点击刷新按钮发起连接请求');
        } else {
            alert(result.message);
        }
    });

    // 等待对方同意连接
    socket.on('waiting_approval', (data) => {
        console.log('Waiting for approval:', data);
        showResult('等待同意', data.message || '等待当前用户同意连接...');
    });

    // 等待用户点击刷新按钮
    socket.on('waiting_for_request', (data) => {
        console.log('Waiting for request:', data);
        showResult('等待操作', data.message || '请点击刷新按钮发起连接请求');
    });

    // 处理刷新/夺回按钮点击
    function handleReconnectClick() {
        if (isAdminDevice) {
            // 主服务机器：直接夺回连接
            if (isConnected) {
                showResult('提示', '您已连接');
                return;
            }
            socket.emit('admin_reclaim', {});
            showResult('正在夺回', '正在夺回连接权...');
        } else {
            // 其他机器：发起连接请求
            requestReconnect();
        }
    }

    // 发起重新连接请求
    function requestReconnect() {
        if (isConnected) {
            showResult('提示', '您已连接');
            return;
        }

        // 如果被拒绝过，不能再次发起请求
        if (requestDenied) {
            showResult('提示', '您已被拒绝，请联系当前使用者获得使用权');
            return;
        }

        // 如果还没有获取到IP，先触发获取
        if (!myIP) {
            showResult('提示', '正在获取IP地址，请稍候再试...');
            return;
        }

        // 检查本地存储的邮箱
        let savedEmail = localStorage.getItem('user_email');
        if (!savedEmail) {
            // 弹出邮箱输入框
            document.getElementById('emailOverlay').style.display = 'flex';
            return;
        }
        // 验证邮箱格式
        if (!savedEmail.endsWith('@openvision.cc')) {
            showResult('提示', '邮箱格式错误，需要xxx@openvision.cc格式');
            return;
        }

        // 发送请求前先确认
        const confirmMsg = '将向当前连接用户发送连接请求，对方同意后您才能连接。\n\n确定要发送请求吗？';
        if (!confirm(confirmMsg)) {
            return;
        }

        // 发送重新连接请求
        socket.emit('request_reconnect', {email: savedEmail, ip: myIP});
        showResult('请求已发送', '等待当前连接用户审批...');
    }

    // 提交邮箱
    function submitEmail() {
        const email = document.getElementById('emailInput').value.trim();
        const emailRegex = /^[a-zA-Z0-9._%+-]+@openvision\.cc$/;
        if (!emailRegex.test(email)) {
            alert('请输入正确的邮箱格式：xxx@openvision.cc');
            return;
        }
        // 禁止使用默认邮箱
        if (email.toLowerCase() === 'jack@openvision.cc') {
            alert('该邮箱为系统保留邮箱，无法使用');
            return;
        }
        localStorage.setItem('user_email', email);
        closeEmailPopup();

        // 提交邮箱到后端
        socket.emit('submit_email', {email: email});

        // 如果是重新连接请求或首次连接需要邮箱，发起连接
        if (pendingReconnectAfterEmail) {
            pendingReconnectAfterEmail = false;
            socket.emit('request_reconnect', {email: email, ip: myIP});
            showResult('请求已发送', '等待当前连接用户审批...');
        }
    }

    // 关闭邮箱弹窗
    function closeEmailPopup() {
        document.getElementById('emailOverlay').style.display = 'none';
        document.getElementById('emailInput').value = '';
    }

    // 显示结果弹窗
    function showResult(title, message) {
        document.getElementById('resultTitle').textContent = title;
        document.getElementById('resultMessage').textContent = message;
        document.getElementById('resultOverlay').style.display = 'flex';
    }

    // 关闭结果弹窗
    function closeResultPopup() {
        document.getElementById('resultOverlay').style.display = 'none';
    }

    // 处理请求（允许/不允许）
    function handleRequest(action) {
        if (action === 'allow') {
            socket.emit('reconnect_response', {approved: true, request_id: pendingRequest});
        } else {
            // 检查当前用户是否有邮箱
            let savedEmail = localStorage.getItem('user_email');
            if (!savedEmail) {
                // 弹出邮箱输入框
                document.getElementById('emailOverlay').style.display = 'flex';
                return;
            }
            socket.emit('reconnect_response', {approved: false, request_id: pendingRequest, email: savedEmail});
        }
        closeRequestPopup();
    }

    // 关闭请求弹窗
    function closeRequestPopup() {
        document.getElementById('requestOverlay').style.display = 'none';
        if (countdownTimer) {
            clearInterval(countdownTimer);
            countdownTimer = null;
        }
        if (requestTimeout) {
            clearTimeout(requestTimeout);
            requestTimeout = null;
        }
        pendingRequest = null;
    }

    // 显示请求弹窗
    function showRequestPopup(request) {
        pendingRequest = request.request_id;
        document.getElementById('requestInfo').textContent = request.english_name + '\n申请访问连接设备，将挤掉您的连接';
        document.getElementById('requestOverlay').style.display = 'block';

        // 30秒倒计时
        let count = 30;
        document.getElementById('countdown').textContent = count;
        countdownTimer = setInterval(() => {
            count--;
            document.getElementById('countdown').textContent = count;
            if (count <= 0) {
                clearInterval(countdownTimer);
                // 倒计时结束，自动允许
                handleRequest('allow');
            }
        }, 1000);

        // 30秒后超时
        requestTimeout = setTimeout(() => {
            closeRequestPopup();
        }, 30000);
    }

    // 接收连接请求（作为已连接用户）
    socket.on('connection_request', (request) => {
        console.log('Received connection_request:', request);
        showRequestPopup(request);
    });

    // 接收请求结果
    socket.on('request_result', (result) => {
        console.log('Request result:', result);
        if (result.approved) {
            const message = result.message || '';
            if (message.includes('让出')) {
                // 管理员让出了连接，显示提示
                showResult('已让出连接', message);
                // 标记为已让出连接，刷新页面后不自动发起请求，需要用户手动点击刷新按钮
                localStorage.setItem('just_surrendered', 'true');
                // 断开连接
                isConnected = false;
                updatePowerButton(false);
                setControlButtonsEnabled(false);
            } else {
                // 请求者收到允许，1秒后刷新页面
                showResult('已允许', '连接请求已通过，1秒后自动刷新...');
                setTimeout(() => {
                    location.reload();
                }, 1000);
            }
        } else {
            // 被拒绝时显示拒绝者的英文名
            const msg = result.english_name ? result.english_name + '\n当前用户还在使用当中，请联系获得使用权' : '请求被拒绝';
            showResult('已拒绝', msg);
            // 标记为被拒绝，不能再次发起请求
            requestDenied = true;
        }
    });

    socket.addEventListener('close', () => {
        document.getElementById('status').textContent = 'connect closed';
        updatePowerButton(false);
        setControlButtonsEnabled(false);
    });

    socket.addEventListener('error', (error) => {
        document.getElementById('status').textContent = 'websocket error: ' + error.message;
        updatePowerButton(false);
        setControlButtonsEnabled(false);
    });

    window.addEventListener('beforeunload', () => {
        socket.disconnect();
    });
</script>
</body>

</html>

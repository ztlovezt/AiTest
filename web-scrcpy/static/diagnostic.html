<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Connection Diagnostic</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .log { background: white; padding: 10px; margin-top: 20px; border: 1px solid #ccc; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Web-Scrcpy Connection Diagnostic</h1>
    
    <div id="httpStatus" class="status info">Testing HTTP connection...</div>
    <div id="socketStatus" class="status info">Testing WebSocket connection...</div>
    <div id="videoStatus" class="status info">Waiting for video data...</div>
    
    <div class="log" id="log"></div>

    <script src="/static/js/socket.io.js"></script>
    <script>
        const logDiv = document.getElementById('log');
        let videoDataReceived = false;

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'red' : (type === 'success' ? 'green' : 'black');
            logDiv.innerHTML += `<div style="color: ${color}; margin: 5px 0;">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Test HTTP connection
        fetch('/')
            .then(response => {
                if (response.ok) {
                    document.getElementById('httpStatus').className = 'status success';
                    document.getElementById('httpStatus').textContent = '✓ HTTP connection successful';
                    addLog('HTTP connection successful', 'success');
                }
            })
            .catch(error => {
                document.getElementById('httpStatus').className = 'status error';
                document.getElementById('httpStatus').textContent = '✗ HTTP connection failed: ' + error.message;
                addLog('HTTP connection failed: ' + error.message, 'error');
            });

        // Test WebSocket connection
        const socket = io({
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });

        socket.on('connect', () => {
            document.getElementById('socketStatus').className = 'status success';
            document.getElementById('socketStatus').textContent = '✓ WebSocket connected';
            addLog('WebSocket connected successfully', 'success');
        });

        socket.on('connect_error', (error) => {
            document.getElementById('socketStatus').className = 'status error';
            document.getElementById('socketStatus').textContent = '✗ WebSocket error: ' + error.message;
            addLog('WebSocket error: ' + error.message, 'error');
        });

        socket.on('disconnect', () => {
            document.getElementById('socketStatus').className = 'status error';
            document.getElementById('socketStatus').textContent = '✗ WebSocket disconnected';
            addLog('WebSocket disconnected', 'error');
        });

        socket.on('video_data', (data) => {
            if (!videoDataReceived) {
                videoDataReceived = true;
                document.getElementById('videoStatus').className = 'status success';
                document.getElementById('videoStatus').textContent = '✓ Video data receiving (' + data.length + ' bytes)';
                addLog('First video data received: ' + data.length + ' bytes', 'success');
            } else {
                addLog('Video data: ' + data.length + ' bytes');
            }
        });

        // Auto-reload page if no connection after 10 seconds
        setTimeout(() => {
            if (!socket.connected) {
                addLog('No connection after 10 seconds, reloading...', 'info');
                setTimeout(() => location.reload(), 2000);
            }
        }, 10000);

        addLog('Diagnostic page loaded', 'info');
    </script>
</body>
</html>

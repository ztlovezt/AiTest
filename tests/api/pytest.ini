[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --maxfail=20
markers =
    smoke: 冒烟用例,优先级 P0
    p0: P0 核心功能用例
    p1: P1 重要功能用例
    p2: P2 一般功能用例
    positive: 正向场景
    boundary: 边界场景
    anomaly: 异常场景
    combination: 组合场景
    security: 安全场景
    performance: 性能场景
    auth: auth 模块
    projects: projects 模块
    users: users 模块
    testcases: testcases 模块(第 2 批)
    executions: executions 模块(第 2 批)
    reviews: reviews 模块(第 2 批)
    review_required: 需人工评审,置信度 LOW

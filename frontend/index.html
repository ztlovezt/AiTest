<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TestHub - AI一体化测试平台</title>
    <script>
      // 在 CSS 渲染前预设主题，防止首屏闪烁
      ;(function () {
        var theme = localStorage.getItem('app-theme') || 'hoppscotch-light'
        var colorTheme = localStorage.getItem('app-color-theme') || 'indigo'
        var isDark = theme === 'hoppscotch-dark'
        var root = document.documentElement
        root.setAttribute('data-theme', theme)
        root.setAttribute('data-color-theme', colorTheme)
        var themes = {
          indigo: {
            light: { '--th-color-primary':'#5b5bd6','--th-color-primary-strong':'#4747c2','--th-color-primary-soft':'#eef0ff','--th-sidebar-text-active':'#5b5bd6','--th-sidebar-item-bg-hover':'rgba(91,91,214,0.08)','--th-sidebar-item-bg-active':'rgba(91,91,214,0.16)' },
            dark:  { '--th-color-primary':'#7c7ce0','--th-color-primary-strong':'#5b5bd6','--th-color-primary-soft':'rgba(124,124,224,0.15)','--th-sidebar-text-active':'#9b9be8','--th-sidebar-item-bg-hover':'rgba(124,124,224,0.12)','--th-sidebar-item-bg-active':'rgba(124,124,224,0.22)' }
          },
          'semi-orange': {
            light: { '--th-color-primary':'#F5722B','--th-color-primary-strong':'#D4580D','--th-color-primary-soft':'#FFF3EB','--th-sidebar-text-active':'#F5722B','--th-sidebar-item-bg-hover':'rgba(245,114,43,0.08)','--th-sidebar-item-bg-active':'rgba(245,114,43,0.16)' },
            dark:  { '--th-color-primary':'#E8793A','--th-color-primary-strong':'#F5722B','--th-color-primary-soft':'rgba(232,121,58,0.15)','--th-sidebar-text-active':'#F0A070','--th-sidebar-item-bg-hover':'rgba(232,121,58,0.12)','--th-sidebar-item-bg-active':'rgba(232,121,58,0.22)' }
          }
        }
        var cfg = themes[colorTheme]
        if (cfg) {
          var colors = isDark ? cfg.dark : cfg.light
          for (var k in colors) root.style.setProperty(k, colors[k])
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
